upd();tick=setInterval(upd,500);
$('#fx').onclick=()=>{S.flight.focus=!S.flight.focus;save();fly()};
$('#fe').onclick=()=>{const f=S.flight,mins=Math.floor((Date.now()-f.start)/60000);if(mins>=1)S.sess.unshift({subj:f.subj,dest:f.dest+' (ended early)',m:Math.min(mins,f.m),d:Date.now()});S.flight=null;save();toast(mins>=1?'Flight ended. Time studied is still counted.':'Flight cancelled. No pressure.');fly()}}
/* GOALS */
function goals(){const p=S.prof,hasGpa=Number.isFinite(p.gpa)&&Number.isFinite(p.target),pct=hasGpa?(p.target>0?Math.min(100,Math.round(p.gpa/p.target*100)):100):0,C=2*Math.PI*52;
$('#pg').innerHTML=topbar('Goals','Where you’re headed, at your own pace.')+`<div class="grid g2"><div class="card"><div class="row" style="gap:28px"><svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="${pct}% toward target GPA"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--sf2)" stroke-width="12"/><circle cx="65" cy="65" r="52" fill="none" stroke="var(--acd)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset 1s var(--ease)"/><text x="65" y="72" text-anchor="middle" font-size="24" font-weight="700" fill="var(--tx)">${hasGpa?p.gpa.toFixed(2):'—'}</text></svg><div><h2>${hasGpa?`Current ${p.gpa.toFixed(2)} · Goal ${p.target.toFixed(2)}`:'Set a GPA goal'}</h2><p class="sm mut" style="margin-top:6px">${hasGpa?'A simple comparison. It does not predict future grades.':'Add your current GPA and target when you’re ready.'}</p></div></div>
<h3 style="margin-top:26px">GPA goal explorer</h3><form id="gf" class="row wrap" style="margin-top:8px"><input class="inp" id="gc" type="number" step=".01" min="0" max="4.5" value="${p.gpa??''}" placeholder="Current" style="width:110px" aria-label="Current GPA"><input class="inp" id="gt" type="number" step=".01" min="0" max="4.5" value="${p.target??''}" placeholder="Goal" style="width:110px" aria-label="Target GPA"><button class="btn pri">Update goal</button></form><div id="ge" class="sm" style="margin-top:12px"></div></div>
<div class="card"><h2>Milestones</h2>${S.miles.length?S.miles.map((m,i)=>`<div class="item ${m.d?'done':''}"><button class="ck ${m.d?'on':''}" data-m="${i}" aria-label="Toggle milestone">${m.d?ic('check'):''}</button><span class="t nm">${esc(m.t)}</span></div>`).join(''):'<div class="empty">No milestones yet.</div>'}<form id="mf" class="row" style="margin-top:12px"><input class="inp" id="mn" placeholder="Add a milestone"><button class="btn">${ic('plus')}</button></form></div></div>
<div class="card" style="margin-top:18px"><h2>Subjects</h2>${p.subjects.map(s=>{const n=S.tasks.filter(t=>t.subj===s),d=n.filter(t=>t.done).length;return`<div class="item"><b style="width:110px">${s}</b><div class="bar t"><i style="width:${n.length?d/n.length*100:0}%"></i></div><span class="sm mut">${d}/${n.length} tasks</span></div>`}).join('')||'<div class="empty">Add subjects in Profile.</div>'}</div>`;
const ex=()=>{if(!Number.isFinite(S.prof.gpa)||!Number.isFinite(S.prof.target)){$('#ge').textContent='Enter both numbers to compare your current GPA with your goal.';return}const g=S.prof.target-S.prof.gpa;$('#ge').innerHTML=`<div class="msg a" style="max-width:100%">${g<=0?'You’re at or above your current goal.':'The difference is '+g.toFixed(2)+' points.'} This is a comparison, not a prediction.</div>`};ex();
$('#gf').onsubmit=e=>{e.preventDefault();const c=parseFloat($('#gc').value),t=parseFloat($('#gt').value);if(isNaN(c)||isNaN(t)||c<0||t<0||c>4.5||t>4.5)return toast('Enter GPAs between 0 and 4.5.');p.gpa=c;p.target=t;save();toast('Goal updated');goals();bindTop()};
$$('[data-m]').forEach(b=>b.onclick=()=>{const m=S.miles[b.dataset.m];m.d=!m.d;if(m.d)addXP('Reached a milestone',30);save();goals();bindTop()});$('#mf').onsubmit=e=>{e.preventDefault();const v=$('#mn').value.trim();if(!v)return;S.miles.push({t:v,d:false});save();goals();bindTop()}}
/* PROFILE */
function prof(){const p=S.prof,s=S.set;const sel=(id,l,o,v)=>`<label class="f" for="${id}">${l}</label><select class="sel" id="${id}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
$('#pg').innerHTML=topbar('Profile','Update your preferences and study settings.')+`<div class="grid g2"><form class="card" id="pf2"><h2>About you</h2><label class="f" for="pn">Display name</label><input class="inp" id="pn" value="${esc(p.name)}">${sel('pgr','Grade / year',['Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12','University'],p.grade)}<label class="f" for="psc">School (optional)</label><input class="inp" id="psc" value="${esc(p.school)}">${sel('pl2','Preferred language',['English','Arabic','Hebrew'],p.lang)}<label class="f" for="psp">Languages spoken</label><input class="inp" id="psp" value="${esc(p.spoken.join(', '))}"><label class="f">Subjects</label><div class="row wrap">${SUBJ.map(x=>`<button type="button" class="chip ${p.subjects.includes(x)?'on':''}" data-su="${x}">${x}</button>`).join('')}</div>${sel('pst','Learning preference',['Step by step','Short and direct','With examples','Visually'],p.style)}<p class="sm mut" style="margin-top:12px">Quilt uses your subject and explanation preferences when you ask for help.</p><button class="btn pri" style="margin-top:16px">Save profile</button></form>
<div class="grid" style="align-content:start"><div class="card"><h2>Settings</h2><div class="row sp item"><span>Dark mode</span><button class="btn" id="th">${ic('moon')}${s.theme==='dark'?'On':'Off'}</button></div><div class="item" style="display:block"><span>Accent</span><div class="row wrap" style="margin-top:8px">${Object.keys(ACC).map(a=>`<button class="chip ${s.accent===a?'on':''}" data-ac="${a}"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${ACC[a][0]};margin-inline-end:6px"></span>${a}</button>`).join('')}</div></div>
<div class="row sp item"><span>Reduced motion</span><button class="btn" id="rm">${s.rm?'On':'Off'}</button></div><div class="row sp item"><span>XP & levels (optional)</span><button class="btn" id="xp">${s.xpOn?'On':'Off'}</button></div><div class="item" style="display:block"><span>Language</span><div class="row wrap" style="margin-top:8px">${['English','Arabic','Hebrew'].map(l=>`<button class="chip ${s.lang===l?'on':''}" data-l="${l}">${l}</button>`).join('')}</div>${s.lang!=='English'?'<p class="sm mut" style="margin-top:8px">The layout switches direction; interface labels remain in English.</p>':''}</div>
<div class="row sp item"><span>Reset onboarding</span><button class="btn" id="ro">Reset</button></div></div>
${s.xpOn?`<div class="card"><h2>XP history</h2><p class="sm mut">Rewards effort and consistency. Rest days never cost XP.</p>${S.xp.slice(0,6).map(x=>`<div class="item"><span class="t">${esc(x.t)}</span><b>+${x.x}</b></div>`).join('')}</div>`:''}</div></div>`;
$$('[data-su]').forEach(b=>b.onclick=()=>{const a=p.subjects,x=b.dataset.su;a.includes(x)?a.splice(a.indexOf(x),1):a.push(x);b.classList.toggle('on')});
$('#pf2').onsubmit=e=>{e.preventDefault();const n=$('#pn').value.trim();if(!n)return toast('Display name can’t be empty.');Object.assign(p,{name:n,grade:$('#pgr').value,school:$('#psc').value.trim(),lang:$('#pl2').value,spoken:$('#psp').value.split(',').map(x=>x.trim()).filter(Boolean),style:$('#pst').value});save();toast('Profile saved');render()};
$('#th').onclick=()=>{s.theme=s.theme==='dark'?'light':'dark';save();render()};$$('[data-ac]').forEach(b=>b.onclick=()=>{s.accent=b.dataset.ac;save();render()});$('#rm').onclick=()=>{s.rm=!s.rm;save();render()};$('#xp').onclick=()=>{s.xpOn=!s.xpOn;save();render()};$$('[data-l]').forEach(b=>b.onclick=()=>{s.lang=b.dataset.l;save();render()});$('#ro').onclick=()=>{S.on=false;oi=0;od=null;save();renderOB()}}
applyTheme();render();renderOB();
</script></body></html>
